<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>2026 F1 Race Predictor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.76.0/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@stlite/browser@0.76.0/build/stlite.js"></script>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.76.0/build/stlite.js";

      mount(
        {
          requirements: [
            "streamlit",
            "numpy",
            "pandas",
            "plotly",
            "xgboost",
            "scikit-learn"
          ],
          entrypoint: "app_streamlit.py",
          files: {
            "app_streamlit.py": {
              url: "./app_streamlit.py"
            },
            "predict_azerbaijan.py": {
              url: "./predict_azerbaijan.py"
            },
            "f1_race_winners_data.csv": {
              url: "./f1_race_winners_data.csv"
            }
          }
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
